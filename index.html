<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Один вопрос для тебя 💕</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Фоновые элементы (животные и сердечки) -->
  <div id="background-elements"></div>
  
  <!-- Контейнер для взрыва сердец -->
  <div id="heart-explosion"></div>

  <!-- Слайд 1: Вопрос -->
  <section id="slide1" class="slide active">
    <div class="heart-container">
      <div class="heart-bg"></div>
      <button id="yesBtn" class="yes-in-heart">Да 💖</button>
    </div>
    <button id="noBtn" class="no-btn">Нет</button>
    <p class="hint">Попробуй нажать «Нет» 😏</p>
  </section>

  <!-- Слайд 2: Благодарность -->
  <section id="slide2" class="slide">
    <h1>Спасибо, что согласилась 🥹</h1>
    <p class="sub">Я знал, что ты скажешь да.</p>
    <button class="next-btn" data-next="slide3">Далее →</button>
  </section>

  <!-- Слайд 3: Дата и время -->
  <section id="slide3" class="slide">
    <h2>Когда тебе удобно?</h2>
    <label>Выбери дату:</label>
    <input type="date" id="datePicker">
    <label>Выбери время:</label>
    <input type="time" id="timePicker">
    <button class="next-btn" data-next="slide4">Далее →</button>
  </section>

  <!-- Слайд 4: Еда и кухня -->
  <section id="slide4" class="slide">
    <h2>Что хочешь попробовать?</h2>
    <div class="food-grid">
      <label class="food-card">
        <input type="checkbox" value="Пицца">
        <span class="food-icon">🍕</span>
        <span>Пицца</span>
      </label>
      <label class="food-card">
        <input type="checkbox" value="Суши">
        <span class="food-icon">🍣</span>
        <span>Суши</span>
      </label>
      <label class="food-card">
        <input type="checkbox" value="Бургер">
        <span class="food-icon">🍔</span>
        <span>Бургер</span>
      </label>
      <label class="food-card">
        <input type="checkbox" value="Шашлык">
        <span class="food-icon">🍢</span>
        <span>Шашлык</span>
      </label>
      <label class="food-card">
        <input type="checkbox" value="Торт">
        <span class="food-icon">🍰</span>
        <span>Торт</span>
      </label>
      <label class="food-card">
        <input type="checkbox" value="Винишко">
        <span class="food-icon">🍷</span>
        <span>Винишко</span>
      </label>
    </div>
    <button class="next-btn" data-next="slide5">Далее →</button>
  </section>

  <!-- Слайд 5: Напоминание -->
  <section id="slide5" class="slide">
    <h2>Запомнила? 😊</h2>
    <p class="reminder" id="reminderText"></p>
    <p class="love">Люблю тебя ❤️</p>
  </section>

  <script src="script.js"></script>
</body>
</html>
